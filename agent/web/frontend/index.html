<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Construction Agent — Villa_Test_001</title>
<style>
:root{
  --bg:#0b1220; --panel:#111a2b; --panel2:#17233a; --line:#22314d;
  --txt:#f2f5f9; --muted:#93a5c0; --accent:#ff6a1f; --accent2:#1f4e8c;
  --ok:#3fa86b; --warn:#d99b2b; --bad:#d4534e; --gate:#b06dd4; --unk:#6b7a88;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.imm{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0b1220 0%,#0e1a2e 55%,#0b1220 100%);padding:24px}
.immBox{max-width:760px;width:100%;text-align:center}
.immLb{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:700;margin-bottom:14px}
.immBox h2{font-size:clamp(24px,4vw,38px);color:#fff;margin:0 0 12px;letter-spacing:-.7px}
.immBox p{color:var(--muted);font-size:15px;max-width:520px;margin:0 auto 30px;line-height:1.6}
.immGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.immC{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;
  padding:20px;cursor:pointer;font-family:inherit;transition:.16s}
.immC:hover{border-color:var(--accent);background:rgba(255,106,31,.09);transform:translateY(-2px)}
.immC .immI{font-size:22px;color:var(--accent)}
.immC b{color:#fff;font-size:15.5px;font-weight:700}
.immC i{color:var(--muted);font-size:12.5px;font-style:normal;line-height:1.45}
.immNote{margin-top:24px;font-size:11.5px;color:var(--muted);opacity:.75}
.app{display:flex;min-height:100vh}
/* ===== HERO PLEIN ECRAN + CAROUSEL (2 rendus REELS du projet) ===== */
.hero{position:relative;width:100%;min-height:clamp(430px,72vh,780px);
  display:flex;align-items:flex-end;overflow:hidden;background:#070d18;
  border-bottom:1px solid var(--line)}
.hero .sl{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity 2.6s ease-in-out,transform 12s linear;
  transform:scale(1.06)}
.hero .sl.on{opacity:1;transform:scale(1)}
.hero .ov{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(4,9,18,.94) 0%,rgba(4,9,18,.80) 42%,
             rgba(4,9,18,.42) 72%,rgba(4,9,18,.20) 100%)}
.hero .in{position:relative;z-index:3;padding:clamp(28px,5vw,64px);max-width:760px}
.hero .lb{font-size:11px;letter-spacing:3.2px;font-weight:700;color:var(--accent);
  margin-bottom:16px;text-transform:uppercase}
.hero h1{font-size:clamp(32px,5.6vw,62px);line-height:1.04;font-weight:800;
  color:#fff;letter-spacing:-1.6px;margin:0 0 16px}
.hero h1 em{color:var(--accent);font-style:normal}
.hero p{font-size:clamp(14px,1.5vw,17.5px);color:#c4d2e4;line-height:1.6;
  max-width:520px;margin:0 0 26px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero .b1{background:var(--accent);color:#fff;border:0;padding:14px 24px;border-radius:9px;
  font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:9px;transition:.15s}
.hero .b1:hover{background:#ff8347;transform:translateY(-1px)}
.hero .b2{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.28);
  padding:13px 22px;border-radius:9px;font-weight:600;font-size:14.5px;cursor:pointer;
  font-family:inherit;display:inline-flex;align-items:center;gap:9px;backdrop-filter:blur(6px)}
.hero .b2:hover{background:rgba(255,255,255,.14);border-color:#fff}
.hero .dots{position:absolute;bottom:16px;right:22px;z-index:4;display:flex;gap:7px}
.hero .dots i{width:26px;height:3px;border-radius:2px;background:rgba(255,255,255,.28);
  cursor:pointer;transition:.3s}
.hero .dots i.on{background:var(--accent);width:40px}
.hero .cap{position:absolute;bottom:16px;left:clamp(28px,5vw,64px);z-index:4;
  font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.4px}
.hcaps{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border-top:1px solid var(--line)}
.hcaps > div{background:var(--panel);padding:18px 20px;display:flex;gap:11px;align-items:flex-start}
.hcaps b{display:block;font-size:13px;color:var(--txt);font-weight:700;letter-spacing:.2px}
.hcaps span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.hcaps .ic{font-size:17px;line-height:1;flex:0 0 auto}
@media(max-width:900px){
  .hero{min-height:520px}
  .hcaps{grid-template-columns:1fr 1fr}
  .hero .cap{display:none}
}
/* ===== M1 : HEADER HORIZONTAL STICKY ===== */
.hd{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:20px;
  padding:0 26px;height:62px;background:rgba(11,18,32,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.hd .brand{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;flex:0 0 auto}
.hd .mk{width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#b2460f);
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.hd .nm{font-size:14.5px;font-weight:800;color:var(--txt);letter-spacing:-.2px;line-height:1}
.hd .nm small{display:block;font-size:9.5px;color:var(--accent);letter-spacing:1.6px;font-weight:700;margin-top:2px}
.hd nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.hd nav::-webkit-scrollbar{display:none}
.hd nav a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:7px;color:var(--muted);
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.13s}
.hd nav a:hover{background:var(--panel2);color:var(--txt)}
.hd nav a.on{background:rgba(255,106,31,.13);color:var(--accent)}
.hd .cta{flex:0 0 auto;background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:8px;
  font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:.13s}
.hd .cta:hover{background:#ff8347;transform:translateY(-1px)}
.hd .cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hd .more{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:8px 11px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600}
.hd .more:hover{border-color:var(--accent);color:var(--accent)}
.hdmenu{position:absolute;right:26px;top:58px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:6px;min-width:180px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:90}
.hdmenu a{display:block;padding:9px 12px;border-radius:6px;color:var(--muted);font-size:13.5px;cursor:pointer}
.hdmenu a:hover{background:var(--panel2);color:var(--txt)}
/* ---------- SIDEBAR ---------- */
aside{display:none;width:246px;flex:0 0 246px;background:var(--panel);border-right:1px solid var(--line);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:0 6px}
.brand .mk{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8a6f34);
  display:grid;place-items:center;font-weight:800;color:#141414;font-size:15px}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.2px}
.brand p{font-size:11px;color:var(--muted);margin-top:1px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;color:var(--muted);
  text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;transition:.13s}
nav a:hover{background:var(--panel2);color:var(--txt)}
nav a.on{background:linear-gradient(90deg,rgba(200,164,92,.16),transparent);color:var(--accent);
  box-shadow:inset 2px 0 0 var(--accent)}
nav a i{font-style:normal;width:18px;text-align:center;font-size:14px}
.sep{height:1px;background:var(--line);margin:14px 8px}
/* ---------- MAIN ---------- */
main{flex:1;min-width:0;padding:26px 30px 90px;max-width:1500px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h2{font-size:23px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.modes{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px}
.modes button{background:none;border:0;color:var(--muted);padding:7px 14px;border-radius:6px;cursor:pointer;
  font-size:12.5px;font-weight:600;font-family:inherit}
.modes button.on{background:var(--accent);color:#141414}
/* ---------- CARDS ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600;margin-bottom:11px}
.big{font-size:29px;font-weight:700;letter-spacing:-.6px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.045);font-size:13.5px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted)}
/* ---------- PROGRESS ---------- */
.prog{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.progbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.progbox .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
.bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:11px 0 8px}
.bar i{display:block;height:100%;border-radius:4px}
.progbox .val{font-size:26px;font-weight:700}
.warnline{background:rgba(176,109,212,.09);border:1px solid rgba(176,109,212,.3);border-radius:var(--r);
  padding:13px 16px;font-size:13px;color:#dcc4ec;margin-bottom:20px}
/* ---------- PHASES ---------- */
.ph{display:flex;gap:14px;padding:13px 15px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:.13s;align-items:center}
.ph:hover{border-color:#3d4a55;transform:translateX(2px)}
.ph .num{width:36px;height:36px;flex:0 0 36px;border-radius:8px;background:var(--panel2);display:grid;
  place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.ph .t{flex:1;min-width:0}
.ph .t b{font-size:14.5px;display:block}
.ph .t small{color:var(--muted);font-size:12px;display:block;margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:4px 9px;border-radius:5px;white-space:nowrap}
.b-ok{background:rgba(63,168,107,.15);color:var(--ok)}
.b-ver{background:rgba(92,143,200,.15);color:var(--accent2)}
.b-hyp{background:rgba(217,155,43,.15);color:var(--warn)}
.b-gate{background:rgba(176,109,212,.15);color:var(--gate)}
.b-blk{background:rgba(212,83,78,.15);color:var(--bad)}
.b-unk{background:rgba(107,122,136,.18);color:var(--unk)}
/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,.04)}
tr:hover td{background:rgba(255,255,255,.017)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
/* ---------- PLANS ---------- */
.viewer{position:relative;overflow:hidden;height:clamp(340px,62vh,760px);width:100%;max-width:100%;background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  position:relative;cursor:grab}
.viewer.drag{cursor:grabbing}
.viewer #svgHost{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;transition:transform .1s}
.viewer #svgHost svg{display:block;overflow:visible}
.viewer img{display:block;position:absolute;top:0;left:0;transform-origin:0 0;transition:transform .1s;max-width:none;user-select:none;will-change:transform}
.vbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.vbar button,.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 13px;
  border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;transition:.13s}
.vbar button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
.vbar button.on{background:var(--accent);color:#141414;border-color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pills button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:6px 11px;
  border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:500}
.pills button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
/* ---------- ASSISTANT ---------- */
.msrc{margin-top:8px;font-size:10.5px;color:var(--muted);opacity:.75;font-family:ui-monospace,Menlo,monospace}
.mact{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mact .act{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:6px 11px;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.13s}
.mact .act:hover{background:var(--accent);color:#fff}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:13px}
.msg{max-width:82%;padding:12px 15px;border-radius:11px;font-size:13.8px;white-space:pre-wrap;
  font-family:ui-monospace,Menlo,monospace;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--accent2);color:#fff;font-family:inherit}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg.a.secu{border-color:var(--gate);background:rgba(176,109,212,.09)}
.inrow{display:flex;gap:9px;margin-top:12px}
.inrow input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:13px 15px;
  border-radius:9px;font-size:14px;font-family:inherit;outline:none}
.inrow input:focus{border-color:var(--accent)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chips button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 12px;
  border-radius:16px;font-size:12px;cursor:pointer;font-family:inherit}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
/* ---------- MISC ---------- */
.note{font-size:12.5px;color:var(--muted);background:var(--panel2);border-left:2px solid var(--accent);
  padding:11px 14px;border-radius:0 7px 7px 0;margin-top:12px}
.err{background:rgba(212,83,78,.1);border:1px solid rgba(212,83,78,.35);color:#e8a9a6;padding:12px;
  border-radius:8px;font-size:13px}
.HG{position:fixed;bottom:22px;right:22px;background:linear-gradient(135deg,var(--accent),#a3843f);color:#141414;
  border:0;padding:15px 23px;border-radius:26px;font-weight:700;font-size:13.5px;cursor:pointer;
  box-shadow:0 7px 26px rgba(200,164,92,.3);font-family:inherit;z-index:50}
.HG:hover{transform:translateY(-2px)}
.mob{display:none}
.hide{display:none!important}
@media(max-width:900px){
  /* M1 — correction du debordement horizontal : le layout desktop (flex) doit
     cesser de contraindre la largeur. Sans cela, cartes et CTA sont coupes. */
  html,body{overflow-x:hidden;max-width:100%}
  .app{display:block}
  main{max-width:100%;padding-left:15px;padding-right:15px}
  .g2,.g3{grid-template-columns:1fr!important}
  /* Le header etait la VRAIE cause : logo ~200px + Plus + CTA ~140px > 390px
     -> sa largeur minimale elargissait toute la page. On le rend compressible. */
  .hd{gap:8px;padding:0 10px;overflow-x:hidden}
  .hd .brand{min-width:0;flex-shrink:1;overflow:hidden}
  .hd .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hd .nm small{display:none}
  .hd .mk{width:26px;height:26px;font-size:12px;flex:0 0 26px}
  .hd nav{display:none}
  .hd .more{flex:0 1 auto;padding:7px 9px;font-size:12px;white-space:nowrap}
  .hd .cta{flex:0 1 auto;padding:8px 10px;font-size:11.5px;white-space:nowrap}
  .hdmenu{right:10px}
  aside{display:none}
  main{padding:18px 15px 96px}
  .mob{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);
    justify-content:space-around;padding:9px 4px 11px;z-index:60}
  .mob a{flex:1;text-align:center;color:var(--muted);font-size:10px;cursor:pointer;padding:3px}
  .mob a i{display:block;font-size:19px;font-style:normal;margin-bottom:2px}
  .mob a.on{color:var(--accent)}
  /* M9 : le bouton flottant masquait 7 elements (jusqu a 9 894 px2).
     Retire en mobile ; sa fonction entre dans la navigation basse. */
  .HG{display:none!important}
  table{font-size:12.5px}th,td{padding:8px 6px}
  .msg{max-width:94%}
  #bimGrid{grid-template-columns:1fr!important}   /* panneau BIM -> carte sous la 3D */
  #gl{height:330px!important}                     /* viewer adapte au mobile */
}
</style>

<script>
/* ================= ETAT ================= */
let PRO = false, PAGE = "accueil", CACHE = {}, PLANS = [], ZOOM = 1, TX = 0, TY = 0, CURPLAN = null;
const MENU = [["accueil","🏠","Accueil"],["projet","🏗️","Mon projet"],["etapes","📋","Étapes"],
  ["plans","📐","Plans"],["3d","🧊","3D"],["budget","💰","Budget"],["docs","📄","Documents"],
  ["assistant","💬","Assistant"],["gates","🔒","Validations"]];

async function api(p, opt){
  try{ const r = await fetch(p, opt); if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json(); }
  catch(e){ return {erreur:"Réel : "+e.message, statut:"UNKNOWN", _echec:true}; }
}

/* ===== HERO CAROUSEL — 2 RENDUS REELS du projet (aucune maquette) =====
   Les images viennent de /api/renders ; si l API ne repond pas, le hero reste
   affiche avec son degrade sombre et AUCUNE image inventee. */
const HERO = [
  {fichier:"R01_vue_principale.png", legende:"Rendu du projet - vue principale"},
  {fichier:"R07_salon.png",          legende:"Rendu du projet - salon"}
];
let _heroI = 0, _heroT = null;
function heroApply(){
  HERO.forEach((h, i) => {
    const el = document.getElementById("sl" + i);
    if(!el) return;
    /* Si l API n a pas fourni d URL, on retombe sur le chemin REEL du rendu
       (/files/renders/NOM), verifie en HTTP 200. Aucune image inventee. */
    if(!el.dataset.url && HERO[i] && HERO[i].fichier)
      el.dataset.url = "/files/renders/" + HERO[i].fichier;
    if(!el.dataset.url) return;                       /* pas d image reelle : rien a afficher */
    el.style.backgroundImage = "url('" + el.dataset.url + "')";
    el.className = "sl" + (i === _heroI ? " on" : "");
  });
  const c = document.getElementById("hcap");
  if(c && HERO[_heroI]) c.textContent = HERO[_heroI].legende;
  document.querySelectorAll("#hdots i").forEach((d, i) =>
    d.className = (i === _heroI ? "on" : ""));
}
function heroGo(i){ _heroI = i % HERO.length; heroApply(); }
function heroStart(){ go("projet"); }
function heroVisit(){ go("3d"); }
async function heroInit(){
  try{
    const r = await api("/api/renders");
    const liste = (r && r.rendus) || [];
    HERO.forEach((h, i) => {
      const el = document.getElementById("sl" + i);
      if(!el) return;
      const m = liste.find(x => (x.nom || x.fichier || "").indexOf(h.fichier) >= 0);
      if(m && (m.url || m.fichier)) el.dataset.url = m.url || ("/files/renders/" + h.fichier);
    });
  }catch(e){ /* API indisponible : hero sans image, aucun substitut invente */ }
  heroApply();
  if(_heroT) clearInterval(_heroT);
  _heroT = setInterval(() => heroGo((_heroI + 1) % HERO.length), 7000);   /* defilement auto */
}

/* Formate un entier avec separateurs de milliers (fr). */
function fn(n){
  if(n === null || n === undefined) return "UNKNOWN";
  try{ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }catch(e){ return String(n); }
}
/* Valeur ou UNKNOWN — jamais 0 ni "undefined" a l'ecran. */
function vu(v){ return (v === null || v === undefined || v === "") ? "UNKNOWN" : v; }

/* Premiere visite de la session ? */
function immersionVue() {
  try {
    return !sessionStorage.getItem("ca_immersion");
  } catch (e) {
    return true; /* sessionStorage indisponible : on montre l'ecran */
  }
}

function immersionFermer() {
  try { sessionStorage.setItem("ca_immersion", "vu"); } catch (e) {}
  var el = document.getElementById("imm");
  if (el) el.style.display = "none";
}

function immersionRendu() {
  var el = document.getElementById("imm");
  if (!el) return;

  var cartes = IMMERSION_CHOIX.map(function (c) {
    return '<button class="immC" onclick="immersionGo(\'' + c.id + '\')">' +
             '<span class="immI">' + c.ic + '</span>' +
             '<b>' + c.titre + '</b>' +

  }).join("");

/* Chaque choix declenche un parcours REELLEMENT different. */
function immersionGo(id) {
  try { sessionStorage.setItem("ca_immersion", id); } catch (e) {}
  var el = document.getElementById("imm");
  if (el) el.style.display = "none";

  if (id === "plans") {
    go("plans");
    return;
  }

  if (id === "comprendre") {
    /* Parcours reel : on ouvre l'assistant ET on interroge le Guide Engine. */
    go("assistant");
    setTimeout(function () {
      if (typeof ask === "function") ask("C'est quoi une semelle ?");
    }, 800);
    return;
  }

  if (id === "continuer") {
    go("projet");
    return;
  }

  /* id === "creer" : aucun workflow de creation n'existe cote serveur.
     On ne simule RIEN : on le dit clairement, puis on ouvre le projet reel. */
  go("projet");
  setTimeout(function () {
    if (typeof alertBox === "function") {
      alertBox("CRÉER MON PREMIER PROJET",
        "La création de projet n'est pas disponible : le serveur de Construction Agent " +
        "n'expose aucune route d'écriture.\n\n" +
        "Aucune création n'est simulée.\n\n" +
        "En attendant, vous pouvez explorer le projet réel Villa_Test_001 : " +
        "données terrain, plans 2D, BIM 326 éléments, métrés, budget et validations.");
    }
  }, 350);
}

/* ================= BADGES / STATUTS ================= */
function badge(s){
  const t = (s||"").toUpperCase();
  if(t.includes("HUMAN_GATE")||t.includes("GATE")||t.includes("PENDING_G3")) return '<span class="badge b-gate">⚿ HUMAN GATE</span>';
  if(t.includes("INCONNU")||t.includes("UNKNOWN")||t.includes("NOT_DEFINED")) return '<span class="badge b-unk">? INCONNU</span>';
  if(t.includes("HYPOTH")) return '<span class="badge b-hyp">⚠ HYPOTHÈSE</span>';
  if(t.includes("VÉRIFI")||t.includes("VERIFI")||t.includes("CONNU")) return '<span class="badge b-ver">✓ VÉRIFIÉ</span>';
  if(t.includes("BLOCK")||t.includes("FAIL")) return '<span class="badge b-blk">✕ BLOQUÉ</span>';
  if(t.includes("PROPOSED")) return '<span class="badge b-hyp">◐ PROPOSED</span>';
  if(t.includes("PARTIAL")) return '<span class="badge b-hyp">◐ PARTIEL</span>';
  return '<span class="badge b-ok">✓ VALIDÉ</span>';
}

async function loadPlan(i, btn){
  CURPLAN = PLANS[i];
  document.querySelectorAll("#pills button").forEach(b=>b.className="");
  if(btn) btn.className="on";
  const vw = document.getElementById("vw");
  if(!vw) return;
  let host = document.getElementById("svgHost");
  if(!host){ host = document.createElement("div"); host.id = "svgHost"; vw.appendChild(host); }
  const im = document.getElementById("img");
  if(im) im.style.display = "none";
  /* --- Mesure de la bbox REELLE du contenu, puis viewBox EFFECTIF en memoire.
         Les fichiers SVG sur disque ne sont jamais modifies. --- */
  const nonce = ++_loadSeq;
  fetch(CURPLAN.url).then(r => r.text()).then(txt => {
    if(nonce !== _loadSeq) return;                 /* un autre plan a ete demande entre-temps */
    host.innerHTML = txt;
    const svg = host.querySelector("svg");
    if(!svg) throw new Error("svg absent");
    svg.removeAttribute("width"); svg.removeAttribute("height");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
 /* CORRECTION DU BLANC : getBBox() sur la RACINE est fausse par des elements
       parasites (ex. P02 : 984x1388 @ y=-524 au lieu de 985x864 @ y=0) -> le fit
       reservait une bande vide au-dessus du dessin. On mesure l'UNION des bbox des
       ELEMENTS VISIBLES (exclut defs/mask/marker et tout ce qui est invisible).
       Traite nativement les coordonnees negatives. */
    let bb = null;
    (function(){
      const IGN = ["defs","style","title","desc","metadata","clippath","mask","marker",
                   "pattern","filter","lineargradient","radialgradient","symbol","script"];
      let X0=1e9, Y0=1e9, X1=-1e9, Y1=-1e9, n=0;
      svg.querySelectorAll("*").forEach(el => {
        if(IGN.indexOf(el.tagName.toLowerCase()) >= 0) return;
        const cs = getComputedStyle(el);
        if(cs.display==="none" || cs.visibility==="hidden" || parseFloat(cs.opacity)===0) return;
        let b;
        try{ b = el.getBBox(); }catch(e){ return; }
        if(!isFinite(b.width) || !isFinite(b.height)) return;
        if(b.width <= 0 && b.height <= 0) return;
        let x0=b.x, y0=b.y, x1=b.x+b.width, y1=b.y+b.height;
        const M = el.getCTM ? el.getCTM() : null;
        if(M){
          const d = (M.a*M.d - M.b*M.c) || 1;
          const pts = [[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(p => [
            ( M.d*(p[0]-M.e) - M.c*(p[1]-M.f)) / d,
            (-M.b*(p[0]-M.e) + M.a*(p[1]-M.f)) / d ]);
          x0=Math.min(x0,Math.min.apply(null,pts.map(q=>q[0]))); x1=Math.max(x1,Math.max.apply(null,pts.map(q=>q[0])));
          y0=Math.min(y0,Math.min.apply(null,pts.map(q=>q[1]))); y1=Math.max(y1,Math.max.apply(null,pts.map(q=>q[1])));
        }
        X0=Math.min(X0,x0); Y0=Math.min(Y0,y0); X1=Math.max(X1,x1); Y1=Math.max(Y1,y1); n++;
      });
      if(n && X1>X0 && Y1>Y0) bb = {x:X0, y:Y0, width:X1-X0, height:Y1-Y0, n:n};
    })();
    if(!bb){ try{ bb = svg.getBBox(); }catch(e){ bb = null; } }
    let x, y, w, h2;
    if(bb && bb.width > 0 && bb.height > 0){
      const m = 8;                                 /* marge visuelle autour du dessin */
      x = bb.x - m; y = bb.y - m; w = bb.width + 2*m; h2 = bb.height + 2*m;
    }else{                                          /* repli : viewBox declare tel quel */
      const vb = (svg.getAttribute("viewBox")||"0 0 1000 1000").split(/[\s,]+/).map(Number);
      x = vb[0]||0; y = vb[1]||0; w = vb[2]||1000; h2 = vb[3]||1000;
    }
    svg.setAttribute("viewBox", [x, y, w, h2].join(" "));   /* viewBox EFFECTIF */
    svg.setAttribute("width", w); svg.setAttribute("height", h2);
    CURW = w; CURH = h2;
    _bboxInfo = {n: (bb&&bb.n)||0, declare: CURPLAN.vb_declare || null, effectif: [x, y, w, h2], bbox: bb ? [bb.x,bb.y,bb.width,bb.height] : null};
    ZOOM = 1; TX = 0; TY = 0;
    fitToScreen();
  }).catch(() => {                                  /* si le fetch echoue : repli sur <img> */
    if(nonce !== _loadSeq) return;
    if(host) host.innerHTML = "";
    if(im){ im.style.display = "block"; im.src = CURPLAN.url;
            im.onload = () => { CURW = im.naturalWidth; CURH = im.naturalHeight; fitToScreen(); };
            if(im.complete && im.naturalWidth) im.onload(); }
  });
  const CXd = await ctxLoad();

  const _ter = _tm ? `${vu(_tm[0])} \u00d7 ${vu(_tm[1])} m` : "UNKNOWN";

  const k = (CURPLAN.nom||"").slice(0,3);
  document.getElementById("what").innerHTML = "<b>Que regardez-vous ?</b> " + (desc[k]||"") +
    (PRO?`<br><span class="mono" style="font-size:11.5px;color:var(--muted)">source : BIM_FINAL_A3.blend · ${CURPLAN.octets} o</span>`:"");
  if(!vw._bound){
    vw._bound = 1;
    let dg = 0, lx = 0, ly = 0;                          /* pan souris */
    vw.addEventListener("mousedown", e => { dg=1; lx=e.clientX; ly=e.clientY; vw.classList.add("drag"); e.preventDefault(); });
    window.addEventListener("mouseup", () => { dg=0; vw.classList.remove("drag"); });
    window.addEventListener("mousemove", e => { if(!dg) return;
      TX += e.clientX - lx; TY += e.clientY - ly; lx = e.clientX; ly = e.clientY; applyT(); });
    vw.addEventListener("wheel", e => {                    /* zoom molette, sans modificateur */
      e.preventDefault();
      const r = vw.getBoundingClientRect(), im = document.getElementById("img");
      if(!im) return;
      const z0 = ZOOM, z1 = Math.min(12, Math.max(0.05, ZOOM + (e.deltaY<0 ? 0.12 : -0.12)));
      const cx = (e.clientX-r.left - TX)/z0, cy = (e.clientY-r.top - TY)/z0;
      ZOOM = z1; TX = (e.clientX-r.left) - cx*z1; TY = (e.clientY-r.top) - cy*z1; applyT();
      const st = document.getElementById("zst"); if(st) st.textContent = Math.round(ZOOM*100)+"%";
    }, {passive:false});
    /* Tactile : 1 doigt = pan, 2 doigts = zoom */
    let t0x = 0, t0y = 0, td = 0, tz = 1;
    const dist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
    vw.addEventListener("touchstart", e => {
      if(e.touches.length === 2){ td = dist(e.touches); tz = ZOOM; }
      else if(e.touches.length === 1){ t0x = e.touches[0].clientX; t0y = e.touches[0].clientY; }
    }, {passive:true});
    vw.addEventListener("touchmove", e => {
      if(e.touches.length === 2 && td > 0){                        /* pinch */
        e.preventDefault();
        const r = vw.getBoundingClientRect();
        const z1 = Math.min(12, Math.max(0.05, tz * (dist(e.touches)/td)));
        const cx = (r.width/2 - TX)/ZOOM, cy = (r.height/2 - TY)/ZOOM;
        ZOOM = z1; TX = r.width/2 - cx*z1; TY = r.height/2 - cy*z1; applyT();
      } else if(e.touches.length === 1){                           /* pan */
        TX += e.touches[0].clientX - t0x; TY += e.touches[0].clientY - t0y;
        t0x = e.touches[0].clientX; t0y = e.touches[0].clientY; applyT();
      }
    }, {passive:false});
    /* Le FIT est recalcule quand la fenetre change de taille */
    window.addEventListener("resize", () => { if(document.getElementById("vw")) fitToScreen(); });
  }
}
/* ===== FIT TO SCREEN (correction plans 2D) =====
   scale = min(cw/W, ch/H) puis centrage par translateX/translateY.
   Marge visuelle de 30 px. Ne deforme jamais : un seul facteur d'echelle. */
const PAD = 30;
let _zref = 1;
let _loadSeq = 0;
let _bboxInfo = null;
function z0ratio(){ return _zref; }
/* Dimensions de reference = celles du contenu REEL du SVG (bbox), posees par loadPlan. */
let CURW = 0, CURH = 0;
function fitToScreen(){
  const vw = document.getElementById("vw");
  if(!vw) return;
  let W = CURW, H = CURH;
  if(!W || !H){                              /* repli : aucun fit invente */
    const im = document.getElementById("img");
    W = im ? im.naturalWidth : 0; H = im ? im.naturalHeight : 0;
    if(!W || !H) return;
  }
  const cw = vw.clientWidth - PAD*2, ch = vw.clientHeight - PAD*2;
  if(cw <= 0 || ch <= 0) return;
  ZOOM = Math.min(cw / W, ch / H);           /* <= conserve le ratio */
  TX = PAD + (cw - W*ZOOM)/2;                /* centrage horizontal */
  TY = PAD + (ch - H*ZOOM)/2;                /* centrage vertical   */
  applyT();
  _zref = ZOOM;
  const st = document.getElementById("zst");
  if(st) st.textContent = Math.round(ZOOM*100) + "%";
}
function applyT(){
  const h = document.getElementById("svgHost"), im = document.getElementById("img");
  if(h) h.style.transform = `translate(${TX}px, ${TY}px) scale(${ZOOM})`;
  else if(im) im.style.transform = `translate(${TX}px, ${TY}px) scale(${ZOOM})`;
}
function setZoom(d, reset){
  if(reset){ fitToScreen(); return; }             /* Reinitialiser == FIT exact */
  const vw = document.getElementById("vw"), im = document.getElementById("img");
  if(!vw || !im || !im.naturalWidth){ applyT(); return; }
  const z0 = ZOOM, z1 = Math.min(12, Math.max(0.05, ZOOM + d));
  /* zoom centre sur le milieu de la zone : le point sous le curseur reste stable */
  const cx = (vw.clientWidth/2 - TX)/z0, cy = (vw.clientHeight/2 - TY)/z0;
  ZOOM = z1; TX = vw.clientWidth/2 - cx*z1; TY = vw.clientHeight/2 - cy*z1;
  applyT();
  const st = document.getElementById("zst");
  if(st) st.textContent = Math.round(ZOOM*100) + "%";
}

/* ================= INITIALISATION DU VIEWER ================= */
async function bimStart(b, meta){
  const el = document.getElementById("gl");
  if(!el) return;

    '<b>Vue 3D indisponible</b> — GLB non exporté.<br>Le fichier BLEND original est intact et vérifié.</div>';
    return; }
  try{
    const T = await import("https://unpkg.com/three@0.160.0/build/three.module.js");
    const {OrbitControls} = await import("https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js");
    const {GLTFLoader} = await import("https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js");
    bimDispose();
    const scene = new T.Scene(); scene.background = new T.Color(0x0a0d10);
    const cam = new T.PerspectiveCamera(46, el.clientWidth/el.clientHeight, 0.1, 800);
    const ren = new T.WebGLRenderer({antialias:true}); ren.setPixelRatio(Math.min(2,devicePixelRatio));
    ren.setSize(el.clientWidth, el.clientHeight); el.appendChild(ren.domElement);
    scene.add(new T.HemisphereLight(0xe8eef4, 0x2a3038, 1.6));
    const dl = new T.DirectionalLight(0xffffff, 2.0); dl.position.set(30,45,-20); scene.add(dl);
    const dl2 = new T.DirectionalLight(0xffffff, 0.7); dl2.position.set(-25,20,25); scene.add(dl2);
    const ctl = new OrbitControls(cam, ren.domElement); ctl.enableDamping = true;
    const loader = new GLTFLoader();
    const gltf = await loader.loadAsync(b.glb_url);
    scene.add(gltf.scene);
    /* index : nom de mesh normalise -> element BIM */
    const byNom = {}; (meta.elements||[]).forEach(e => { byNom[e.id] = e; });
    const meshes = [];
    gltf.scene.traverse(o => { if(o.isMesh || o.isObject3D){
      o.traverse && o.traverse(x=>{ if(x.isMesh) meshes.push(x); });
      if(o.isMesh) meshes.push(o);
    }});
    const uniq = [...new Set(meshes)];
    /* BIM3D doit exister AVANT la resolution : resolveBIMIdFromObject lit BIM3D.byNom */
    BIM3D = {T, scene, cam, ren, ctl, meshes: uniq, byNom, meta, el, selected:null, hidden:[], sel:new T.Object3D()};
    uniq.forEach(m => { m.userData.eid = resolveBIMIdFromObject(m);   /* NODE, pas mesh */
      m.userData.baseColor = m.material && m.material.color ? m.material.color.clone() : null; });
    /* contour de selection */
    BIM3D.selBox = new T.BoxHelper(BIM3D.sel, 0xc8a45c); BIM3D.selBox.visible=false; scene.add(BIM3D.selBox);
    const box = new T.Box3().setFromObject(gltf.scene); const ct = box.getCenter(new T.Vector3());
    BIM3D.center = ct; BIM3D.size = box.getSize(new T.Vector3());
    let bbox = null;
    uniq.forEach(m => { const e = m.userData.eid ? byNom[m.userData.eid] : null;
      if(e && e.type !== "Terrain"){ const b2 = new T.Box3().setFromObject(m); bbox = bbox ? bbox.union(b2) : b2; } });
    if(bbox && !bbox.isEmpty()){ BIM3D.bCenter = bbox.getCenter(new T.Vector3()); BIM3D.bSize = bbox.getSize(new T.Vector3()); }
    else { BIM3D.bCenter = ct; BIM3D.bSize = BIM3D.size; }
    bimView("reset");
    const ld = document.getElementById("bimLoad"); if(ld) ld.remove();
    /* clic = selection */
    const rc = new T.Raycaster(); const ptr = new T.Vector2();
    let downX=0, downY=0;
    ren.domElement.addEventListener("pointerdown", e => { downX=e.clientX; downY=e.clientY; });
    ren.domElement.addEventListener("pointerup", e => {
      if(Math.abs(e.clientX-downX) > 5 || Math.abs(e.clientY-downY) > 5) return;  /* c'etait un drag */
      const r = ren.domElement.getBoundingClientRect();
      ptr.x = ((e.clientX-r.left)/r.width)*2-1; ptr.y = -((e.clientY-r.top)/r.height)*2+1;
      rc.setFromCamera(ptr, cam);
      const vis = uniq.filter(m => m.visible);

          ROUTE_SEL+' : aucun élément correspondant dans 3D/bim_elements.json.</div></div>'; }

      '<b>Viewer 3D non chargé</b><br>'+String(err.message||err).slice(0,120)+

      'Le GLB réel reste présent : vérifiez <span class="mono">/api/bim</span>.</div>';
  }
}

/* ============================================================================
   RESOLUTION BIM STRICTE  (BLOC 1 — mapping par NODE GLB, pas par mesh)
   Mesure reelle : 326 nodes -> 326 IDs BIM ; meshes 309/326 seulement.
   Les 17 meshes restants doivent remonter a leur NODE PARENT.
   REGLE : nom EXACT uniquement. Aucune correspondance approximative,
   aucune coordonnee, aucun type. Sinon -> null (jamais d'ID fabrique).
   ============================================================================ */
function resolveBIMIdFromObject(obj){
  if(!obj || typeof BIM3D === "undefined" || !BIM3D) return null;
  const byNom = BIM3D.byNom;
  let cur = obj, prof = 0;
  while(cur && prof < 24){
    const n = cur.name;
    if(n && Object.prototype.hasOwnProperty.call(byNom, n)) return n;   /* nom EXACT */
    cur = cur.parent; prof++;
  }
  return null;
}
function bimStatsResolution(){
  if(!BIM3D) return null;
  let via=0, nul=0; const ids = new Set();
  BIM3D.meshes.forEach(m => {
    if(m.userData.eid && m.name !== m.userData.eid) via++;
    if(!m.userData.eid) nul++;
    if(m.userData.eid) ids.add(m.userData.eid);
  });
  return {meshes:BIM3D.meshes.length, via_parent:via, non_resolus:nul,
          ids_atteints:ids.size, ids_bim:Object.keys(BIM3D.byNom).length};
}

function bimDispose(){
  if(!BIM3D) return;
  try{
    if(BIM3D.onResize) removeEventListener("resize", BIM3D.onResize);
    BIM3D.meshes.forEach(m=>{ if(m.geometry) m.geometry.dispose();
      if(m.material){ (Array.isArray(m.material)?m.material:[m.material]).forEach(x=>x.dispose()); } });
    BIM3D.ren.dispose(); BIM3D.ctl.dispose();
    if(BIM3D.el && BIM3D.ren.domElement && BIM3D.ren.domElement.parentNode)
      BIM3D.ren.domElement.parentNode.removeChild(BIM3D.ren.domElement);
  }catch(e){}
  BIM3D = null;
}

function bimApply(){
  if(!BIM3D) return;
  const groupe = {Poteau:"Structure",Poutre:"Structure",Dalle:"Structure",Semelle:"Structure",
    Longrine:"Structure",Poutre2:"Structure",Mur:"Architecture",Cloison:"Architecture",Fenetre:"Architecture",
    Meuble:"Architecture",Etancheite:"Architecture",Acrotere:"Architecture",Garde:"Exterieur",
    Terrasse:"Exterieur",Garage:"Exterieur",Terrain:"Exterieur",Dallage:"Exterieur",Marche:"Structure"};
  let vis = 0;
  BIM3D.meshes.forEach(m=>{
    const e = m.userData.eid ? BIM3D.byNom[m.userData.eid] : null;
    let ok = true;
    if(BIM3D.fNiv && BIM3D.fNiv!=="Tout") ok = ok && e && (e.niveau===BIM3D.fNiv ||
      (BIM3D.fNiv==="Toiture" && e.niveau==="Toiture") || (BIM3D.fNiv==="Etage" && e.niveau==="Etage"));
    if(ok && BIM3D.fTyp && BIM3D.fTyp!=="Tout") ok = ok && e && groupe[e.type]===BIM3D.fTyp;
    if(ok && BIM3D.fSta && BIM3D.fSta!=="Tout") ok = ok && e && e.statut===BIM3D.fSta;
    if(ok && BIM3D.hidden.indexOf(m.userData.eid)>=0) ok = false;
    m.visible = ok; if(ok) vis++;
  });

function bimFocus(){
  if(!BIM3D || !BIM3D.selected) return;
  const T = BIM3D.T; const box = new T.Box3().setFromObject(BIM3D.selected);
  const ct = box.getCenter(new T.Vector3()); const s = box.getSize(new T.Vector3()).length();
  BIM3D.ctl.target.copy(ct); BIM3D.cam.position.set(ct.x+s*1.3, ct.y+s*1.3, ct.z+s*1.3);
  BIM3D.cam.lookAt(ct); BIM3D.ctl.update();
}
function bimZoom(dir){
  if(!BIM3D) return; const d = new BIM3D.T.Vector3();
  BIM3D.cam.getWorldDirection(d); BIM3D.cam.position.addScaledVector(d, dir*2.5); BIM3D.ctl.update();
}
function bimView(kind){
  if(!BIM3D) return;
  const {cam, ctl} = BIM3D;
  const c = BIM3D.bCenter || BIM3D.center;
  const L = BIM3D.bSize || BIM3D.size;
  const span = Math.max(L.x, L.y, L.z);
  if(kind==="reset"||kind==="persp"){ cam.position.set(c.x+span*0.8, c.y+span*0.8, c.z+span*0.8); }
  else if(kind==="dessus"){ cam.position.set(c.x, c.y+span*1.7, c.z+0.001); }
  else if(kind==="facade"){ cam.position.set(c.x, c.y+span*0.12, c.z+span*1.5); }
  else if(kind==="rdc"){ cam.position.set(c.x+span*0.6, 2.0, c.z+span*0.6); }
  else if(kind==="etage"){ cam.position.set(c.x+span*0.6, 5.2, c.z+span*0.6); }
  ctl.target.copy(c); cam.lookAt(c); ctl.update();
}

/* ============================================================================
   CONSTRUCTION AGENT — B1 : FONDATION UI PREMIUM
   ----------------------------------------------------------------------------
   Ce fichier ne contient AUCUNE donnee projet et AUCUNE requete reseau propre.

   PRINCIPES (mission UI Premium, §21 et §22) :
     - une seule source de donnees : ctxLoad() existant, qui met deja en cache
       /api/assistant/context. On ne cree PAS de deuxieme logique concurrente ;
     - le frontend n'invente jamais : nom, localisation, chambres, surfaces,
       nombre d'elements BIM, budget, progression, statuts viennent du contexte ;
     - aucune valeur par defaut inventee : un champ absent donne "UNKNOWN" ;
     - B1 ne construit AUCUNE des 12 sections : il prepare la fondation.

   PROTECTIONS : ce fichier ne definit rien qui puisse ecraser une fonction
   existante (heroInit, heroApply, immersionGo, bim*, loadPlan, fitToScreen...).
   Tout est range sous le namespace CA.

   Ecrit en chaines simples, sans sequence \u{...} ni template literal imbrique :
   c'est exactement ce qui avait casse la syntaxe lors de la 1re tentative M3.
   ============================================================================ */

var CA = (typeof CA !== "undefined" && CA) ? CA : {};

/* ---------------------------------------------------------------------------
   1. CONTEXTE PROJET — reutilise ctxLoad(), sans dupliquer la requete
   --------------------------------------------------------------------------- */
CA._ctxPromise = null;

/* loadProjectContext() : point d'entree unique des donnees projet.
   Si ctxLoad() existe (defini par index.html), on l'utilise : il gere deja
   le cache. Sinon on appelle /api/assistant/context une seule fois et on
   memorise la promesse, pour ne jamais lancer deux requetes identiques. */
CA.loadProjectContext = function () {
  if (typeof ctxLoad === "function") {
    return Promise.resolve(ctxLoad());
  }
  if (!CA._ctxPromise) {
    if (typeof api !== "function") return Promise.resolve(null);
    CA._ctxPromise = Promise.resolve(api("/api/assistant/context"))
      .catch(function () { return null; });
  }
  return CA._ctxPromise;
};

/* Acces sur a un chemin imbrique : CA.at(ctx, "program.chambres", "UNKNOWN").
   Jamais de 0 ni de undefined a l'ecran : un champ absent devient UNKNOWN. */
CA.at = function (obj, path, def) {
  var cur = obj;
  var parts = String(path || "").split(".");
  for (var i = 0; i < parts.length; i++) {
    if (cur === null || cur === undefined) return (def === undefined ? "UNKNOWN" : def);
    cur = cur[parts[i]];
  }
  if (cur === null || cur === undefined || cur === "") return (def === undefined ? "UNKNOWN" : def);
  return cur;
};

/* Separateur de milliers a la francaise. Aucune valeur en dur. */
CA.num = function (n) {
  if (n === null || n === undefined || n === "") return "UNKNOWN";
  if (typeof n !== "number") {
    var t = parseInt(String(n).replace(/\s/g, ""), 10);
    if (isNaN(t)) return String(n);
    n = t;
  }
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
};

/* ---------------------------------------------------------------------------
   2. PETIT CACHE LOCAL DU CONTEXTE (evite de re-demander le contexte a chaque
      section lors du rendu de l'accueil)
   --------------------------------------------------------------------------- */
CA._ctx = null;

CA.context = function () {
  return CA._ctx;
};

CA.hydrate = function () {
  return CA.loadProjectContext().then(function (c) {
    CA._ctx = c || null;
    return CA._ctx;
  });
};

/* ---------------------------------------------------------------------------
   3. OUTILS DE RENDU — sans dependance a une section particuliere
   --------------------------------------------------------------------------- */
CA.esc = function (s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
};

/* Point de montage : remplace le contenu d'un element s'il existe.
   Ne cree rien si la cible est absente (aucune erreur si la section n'est
   pas encore branchee). */
CA.mount = function (id, html) {
  var el = document.getElementById(id);
  if (!el) return false;
  el.innerHTML = html;
  return true;
};

/* ---------------------------------------------------------------------------
   4. REGISTRE DES SECTIONS — PREPARE EN B1, CONSTRUIT EN B2..B8
      Chaque entree est un emplacement reserve. En B1 elles renvoient une
      chaine vide : la fondation est posee, les sections ne sont PAS baties.
   --------------------------------------------------------------------------- */
CA.SECTION_IDS = {
  hero: "homeHero",
  parcours: "homeParcours",
  assistant: "homeAssistant",
  projet: "homeProjet",
  bim: "homeBim",
  plans: "homePlans",
  guide: "homeGuide",
  budget: "homeBudget",
  gates: "homeGates",
  cta: "homeCta",
  footer: "homeFooter"
};

CA.sections = {};

/* B2 */ CA.sections.hero      = function () { return ""; };
/* B3 */ CA.sections.parcours   = function () { return ""; };
/* B4 */ CA.sections.assistant  = function () { return ""; };
/* B5 */ CA.sections.projet     = function () { return ""; };
/* B5 */ CA.sections.bim        = function () { return ""; };
/* B5 */ CA.sections.plans      = function () { return ""; };
/* B5 */ CA.sections.guide      = function () { return ""; };
/* B5 */ CA.sections.budget     = function () { return ""; };
/* B6 */ CA.sections.gates      = function () { return ""; };
/* B6 */ CA.sections.cta        = function () { return ""; };
/* B6 */ CA.sections.footer     = function () { return ""; };

/* Etat de la fondation — utile pour verifier B1 dans le navigateur. */
CA.status = function () {
  return {
    fondation: "B1",
    ctxLoad_disponible: (typeof ctxLoad === "function"),
    api_disponible: (typeof api === "function"),
    namespace: (typeof CA === "object"),
    contexte_charge: !!CA._ctx,
    sections_preparees: Object.keys(CA.sections).length,
    sections_construites: 0
  };
};

/* ---------------------------------------------------------------------------
   5. PARCOURS M3 — on APPELLE l'existant, on ne le reimplemente pas.
      (M3 est VERIFIED : immersionGo() doit rester la seule logique.)
   --------------------------------------------------------------------------- */
CA.parcoursLancer = function (id) {
  if (typeof immersionGo === "function") { immersionGo(id); return true; }
  return false;
};

/* ---------------------------------------------------------------------------
   6. NAVIGATION — delegue a go() existant. Aucun duplicata.
   --------------------------------------------------------------------------- */
CA.aller = function (page) {
  if (typeof go === "function") { go(page); return true; }
  return false;
};

/* ---------------------------------------------------------------------------
   7. AMORCAGE — hydrate le contexte et signale l'etat.
      Ne monte AUCUNE section (B1). Ne touche a aucune fonction existante.
   --------------------------------------------------------------------------- */
CA.boot = function () {
  return CA.hydrate().then(function (ctx) {
    if (typeof console !== "undefined" && console.log) {
      console.log("[CA] B1 fondation prete — contexte " + (ctx ? "charge" : "indisponible") +
                  " · sections preparees : " + Object.keys(CA.sections).length);
    }
    return ctx;
  });
};

if (typeof window !== "undefined") {
  window.CA = CA;
}
/* ===== FIN home_ui.js ===== */

/* ===== DEBUT home_hero.js (B2 — valide par node --check) ===== */
/* ============================================================================
   CONSTRUCTION AGENT — B2 : HERO EN DEUX ZONES
   ----------------------------------------------------------------------------
   OBJECTIF : mise en page GAUCHE = message + CTA, DROITE = rendu reel du projet.

   MOTEUR NON TOUCHE. heroInit(), heroApply() et heroGo() ne sont ni redefinis
   ni modifies. Aucune rotation, aucun dot, aucune URL n'est touchee.

   POURQUOI DU CSS ET PAS DES <img> :
     heroApply() fait  el.className = "sl" + (i === _heroI ? " on" : "");
     -> il ECRAit les classes des slides a chaque changement. On ne touche donc
        pas aux slides : on ajoute une classe sur .hero et on repositionne les
        slides en CSS. Le moteur continue de poser ses fonds d'image exactement
        comme avant, mais dans la moitie droite.

   Aucune image creee, aucun base64, aucune valeur projet en dur.
   ============================================================================ */

var CA = (typeof CA !== "undefined" && CA) ? CA : {};

/* ---------------------------------------------------------------------------
   1. FEUILLE DE STYLE — injectee une seule fois, marquee pour verification
   --------------------------------------------------------------------------- */
CA.heroStyle = function () {
  if (document.getElementById("ca-hero-b2")) return false;
  var st = document.createElement("style");
  st.id = "ca-hero-b2";
  st.textContent = [
    /* --- .hero passe en deux zones : le texte occupe la gauche --- */
    ".hero.hero-split{min-height:clamp(480px,72vh,760px);display:block;",
    "  border-radius:0 0 18px 18px;border-bottom:1px solid var(--line)}",
    ".hero.hero-split .in{max-width:52%;padding:0 40px 76px 0}",
    /* --- les slides sont confines a la moitie droite + fondu vers la gauche --- */
    ".hero.hero-split .sl{left:52%;right:0;top:0;bottom:0;",
    "  border-radius:14px 0 0 14px;",
    "  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 14%,#000 34%);",
    "          mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 14%,#000 34%)}",
    /* --- overlay : assombrit la gauche pour la lisibilite du titre --- */
    ".hero.hero-split .ov{background:linear-gradient(90deg,",
    "  rgba(11,18,32,.985) 0%,rgba(11,18,32,.97) 44%,rgba(11,18,32,.42) 62%,",
    "  rgba(11,18,32,.10) 84%,rgba(11,18,32,0) 100%)}",
    /* --- badge BIM dynamique, coin du rendu --- */
    ".ca-heroBadge{position:absolute;right:26px;bottom:26px;z-index:6;",
    "  display:flex;align-items:center;gap:10px;padding:11px 15px;",
    "  background:rgba(11,18,32,.62);border:1px solid var(--line);border-radius:11px;",
    "  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}",
    ".ca-heroBadge .ic{width:26px;height:26px;border-radius:7px;flex:0 0 26px;",
    "  background:linear-gradient(135deg,var(--accent),#b2460f);",
    "  display:grid;place-items:center;font-size:13px}",
    ".ca-heroBadge b{display:block;color:var(--txt);font-size:12.5px;font-weight:700;line-height:1.15}",
    ".ca-heroBadge span{display:block;color:var(--muted);font-size:11px;margin-top:2px}",
    /* --- tablette : la composition glisse vers le vertical --- */
    "@media (max-width:1020px){",
    "  .hero.hero-split .in{max-width:60%;padding-right:24px}",
    "  .hero.hero-split .sl{left:46%}}",
    /* --- mobile : rendu AU-DESSUS, texte en dessous. Jamais une grille comprimee --- */
    "@media (max-width:900px){",
    "  .hero.hero-split{min-height:0;display:block}",
    "  .hero.hero-split .sl{left:0;right:0;top:0;bottom:52%;border-radius:0;",
    "    -webkit-mask-image:linear-gradient(180deg,#000 0,#000 66%,transparent 100%);",
    "            mask-image:linear-gradient(180deg,#000 0,#000 66%,transparent 100%)}",
    "  .hero.hero-split .ov{background:linear-gradient(180deg,",
    "    rgba(11,18,32,.30) 0%,rgba(11,18,32,.72) 42%,rgba(11,18,32,.97) 62%,var(--bg) 100%)}",
    "  .hero.hero-split .in{max-width:100%;padding:44vh 18px 30px}",
    "  .ca-heroBadge{right:14px;bottom:calc(52% + 14px)}}",
    /* --- accessibilite : animations desactivees, le hero reste complet --- */
    "@media (prefers-reduced-motion:reduce){",
    "  .hero.hero-split .sl{transition:none}}"
  ].join("\n");
  (document.head || document.documentElement).appendChild(st);
  return true;
};

/* ---------------------------------------------------------------------------
   2. BADGE BIM — valeur DYNAMIQUE, jamais ecrite en dur
   --------------------------------------------------------------------------- */
CA.heroBadge = function () {
  var h = document.getElementById("hero");
  if (!h) return false;
  var old = document.getElementById("ca-heroBadge");
  if (old) old.parentNode.removeChild(old);

  var el = document.createElement("div");
  el.id = "ca-heroBadge";
  el.className = "ca-heroBadge";
  el.setAttribute("role", "status");
  el.innerHTML =
    '<span class="ic">&#129513;</span><div><b>BIM 3D</b><span>' +
    CA.esc(CA.badgeTexte()) + '</span></div>';
  h.appendChild(el);
  return true;
};

/* Texte du badge : uniquement a partir du contexte reel.
   Si le contexte est absent, on affiche UNKNOWN plutot qu'un chiffre invente. */
CA.badgeTexte = function () {
  var c = CA.context();
  if (!c) return "UNKNOWN";
  var n = CA.at(c, "bim.total", null);
  if (n === null) return "UNKNOWN";
  return CA.num(n) + " \u00e9l\u00e9ments";
};

/* ---------------------------------------------------------------------------
   3. APPLICATION — une seule fois, apres que le hero soit dans le DOM
   --------------------------------------------------------------------------- */
CA.heroApplyLayout = function () {
  var h = document.getElementById("hero");
  if (!h) return false;
  CA.heroStyle();
  h.classList.add("hero-split");
  CA.heroBadge();
  return true;
};

/* Point d'entree appele par l'accueil. Ne touche a AUCUNE fonction existante. */
CA.heroBoot = function () {
  return CA.hydrate().then(function (c) {
    CA.heroApplyLayout();           /* le badge se remplit avec CA.context() */
    if (typeof console !== "undefined" && console.log) {
      console.log("[CA] B2 hero deux zones — contexte " + (c ? "charge" : "indisponible") +
                  " · badge : " + CA.badgeTexte());
    }
    return true;
  });
};

if (typeof window !== "undefined") {
  window.CA = CA;
}
/* ===== FIN home_hero.js ===== */
</script>
